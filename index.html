<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>位元擺渡人 / Byte Ferryman</title>
    <style>
      :root {
        --bg-1: #0b0f14;
        --bg-2: #0f1a22;
        --card: #111926;
        --ink: #e6ecf2;
        --muted: #a6b2c1;
        --line: #253244;
        --accent: #7cc9ff;
        --accent-2: #5ef2c5;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "IBM Plex Sans", "Noto Sans TC", "Microsoft JhengHei", "PingFang TC",
          sans-serif;
        color: var(--ink);
        background: radial-gradient(1200px 700px at 10% -10%, #182739 0%, transparent 60%),
          radial-gradient(900px 600px at 100% 0%, #142033 0%, transparent 55%),
          linear-gradient(180deg, var(--bg-2), var(--bg-1));
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 48px 20px 64px;
        position: relative;
        overflow-x: hidden;
      }

      body::before {
        content: "";
        position: fixed;
        inset: -20% -10% auto -10%;
        height: 320px;
        background: linear-gradient(90deg, rgba(124, 201, 255, 0.16), rgba(94, 242, 197, 0.08));
        filter: blur(40px);
        opacity: 0.7;
        pointer-events: none;
      }

      .shell {
        width: min(900px, 100%);
        background: rgba(17, 25, 38, 0.9);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 32px clamp(22px, 3vw, 36px) 36px;
        box-shadow: 0 24px 80px rgba(4, 9, 14, 0.6);
        backdrop-filter: blur(8px);
        animation: rise 0.6s ease-out;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 24px;
      }

      .mark {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        background: linear-gradient(135deg, rgba(124, 201, 255, 0.8), rgba(94, 242, 197, 0.8));
        display: grid;
        place-items: center;
        color: #091018;
        font-weight: 700;
        letter-spacing: 1px;
      }

      h1 {
        margin: 0;
        font-size: clamp(24px, 4vw, 32px);
        letter-spacing: 0.4px;
      }

      .subtitle {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 14px;
      }

      .grid {
        display: grid;
        gap: 18px;
      }

      label {
        font-size: 13px;
        color: var(--muted);
        display: block;
        margin-bottom: 8px;
        letter-spacing: 0.2px;
      }

      input,
      textarea {
        width: 100%;
        border: 1px solid var(--line);
        background: #0b121b;
        color: var(--ink);
        border-radius: 12px;
        padding: 12px 14px;
        font-size: 15px;
        outline: none;
        transition: border 0.2s ease, box-shadow 0.2s ease;
      }

      input:focus,
      textarea:focus {
        border-color: rgba(124, 201, 255, 0.8);
        box-shadow: 0 0 0 3px rgba(124, 201, 255, 0.12);
      }

      textarea {
        min-height: 180px;
        resize: vertical;
        line-height: 1.6;
      }

      .hint {
        border: 1px dashed rgba(124, 201, 255, 0.35);
        background: rgba(12, 20, 30, 0.8);
        padding: 14px 16px;
        border-radius: 14px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.6;
      }

      .actions {
        display: flex;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
      }

      button {
        border: none;
        background: linear-gradient(120deg, var(--accent), var(--accent-2));
        color: #0b1118;
        padding: 12px 28px;
        font-size: 15px;
        font-weight: 700;
        border-radius: 999px;
        cursor: pointer;
        box-shadow: 0 10px 24px rgba(124, 201, 255, 0.18);
        transition: transform 0.15s ease, box-shadow 0.2s ease;
      }

      button:hover {
        transform: translateY(-1px);
        box-shadow: 0 14px 26px rgba(124, 201, 255, 0.25);
      }

      .status {
        color: var(--muted);
        font-size: 13px;
      }

      footer {
        margin-top: 24px;
        font-size: 12px;
        color: rgba(166, 178, 193, 0.7);
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 640px) {
        .shell {
          padding: 26px 18px 30px;
        }

        .actions {
          flex-direction: column;
          align-items: stretch;
        }

        button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="brand">
        <div class="mark">BF</div>
        <div>
          <h1>位元擺渡人 / Byte Ferryman</h1>
          <p class="subtitle">私用擺渡介面 (Serverless API 版)</p>
        </div>
      </header>

      <section class="grid">
        <div>
          <label for="subject">信件主旨</label>
          <input id="subject" type="text" placeholder="輸入主旨" autocomplete="off" />
        </div>

        <div>
          <label for="message">文字內文</label>
          <textarea id="message" placeholder="輸入要擺渡的內容"></textarea>
        </div>

        <div>
          <label for="fileInput">擺渡檔案附件 (.zip, .pdf, 圖片等)</label>
          <input id="fileInput" type="file" />
        </div>

        <div class="hint">
          💡 <b>免登入模式：</b>請直接在上方選取或拖入檔案，點擊啟航後，網頁將透過加密管道直接將資料送往雲端，無需登入 GitHub。
        </div>

        <div class="actions">
          <button id="launch" type="button">啟航</button>
          <div class="status" id="status">Ready</div>
        </div>
      </section>

      <footer>資料會在擺渡完成後在雲端執行，本地不留痕跡。</footer>
    </main>

    <script>
      // ⚠️ 請修改為你的個人設定
      const REPO_OWNER = "你的GITHUB帳號";
      const REPO_NAME = "Byte_FerryMan";

      /* 🔒 安全防護：將你的 Fine-grained Token (例如: github_pat_123456...) 拆成四段。
         請把你的 Token 依序拆開填入下方，網頁執行時才會動態拼接，防止明文關鍵字被資安設備輕易識別。
      */
      const t1 = "github_pat_請填第一段";
      const t2 = "請填第二段";
      const t3 = "請填第三段";
      const t4 = "請填最後一段";

      const subjectInput = document.getElementById("subject");
      const messageInput = document.getElementById("message");
      const fileInput = document.getElementById("fileInput");
      const status = document.getElementById("status");

      // 將文字轉為 Unicode Base64
      function base64EncodeUnicode(text) {
        const bytes = new TextEncoder().encode(text);
        let binary = "";
        bytes.forEach((byte) => { binary += String.fromCharCode(byte); });
        return btoa(binary);
      }

      // 將實體檔案轉為 Base64 字串
      function fileToBase64(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.readAsDataURL(file);
          reader.onload = () => {
            // 移除 data:application/zip;base64, 等前綴
            const base64Str = reader.result.split(",")[1];
            resolve(base64Str);
          };
          reader.onerror = (error) => reject(error);
        });
      }

      document.getElementById("launch").addEventListener("click", async () => {
        if (t1.includes("請填")) {
          alert("❌ 請先在原始碼中填入並拆分您的 GitHub Token！");
          return;
        }

        const title = subjectInput.value.trim() || "Byte Ferryman Mail";
        const rawMessage = messageInput.value.trim();
        const encryptedMessage = rawMessage ? base64EncodeUnicode(rawMessage) : "";
        
        status.textContent = "正在處理檔案...";
        let filePayload = "";
        let fileName = "";

        if (fileInput.files.length > 0) {
          const file = fileInput.files[0];
          fileName = file.name;
          try {
            filePayload = await fileToBase64(file);
          } catch (e) {
            status.textContent = "檔案讀取失敗";
            alert("檔案讀取失敗: " + e);
            return;
          }
        }

        status.textContent = "正在發送擺渡請求...";
        const gateToken = `${t1}${t2}${t3}${t4}`;
        const apiUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/dispatches`;

        // 包裝傳遞給 Actions 的 Payload 數據
        const payloadData = {
          event_type: "ferry_trigger",
          client_payload: {
            title: title,
            message: encryptedMessage,
            file_data: filePayload,
            file_name: fileName
          }
        };

        try {
          const response = await fetch(apiUrl, {
            method: "POST",
            headers: {
              "Accept": "application/vnd.github+json",
              "Authorization": `Bearer ${gateToken}`,
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json"
            },
            body: JSON.stringify(payloadData)
          });

          if (response.status === 204) {
            status.textContent = "🚀 啟航成功！資料已安全送往雲端排隊發信。";
            subjectInput.value = "";
            messageInput.value = "";
            fileInput.value = "";
          } else {
            const errText = await response.text();
            status.textContent = `發送失敗 (${response.status})`;
            console.error(errText);
          }
        } catch (error) {
          status.textContent = "網路連線異常";
          console.error(error);
        }
      });
    </script>
  </body>
</html>
