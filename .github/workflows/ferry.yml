name: Byte Ferryman (Serverless API)

on:
  repository_dispatch:
    types: [ferry_trigger]

jobs:
  ferry:
    runs-on: ubuntu-latest
    steps:
      - name: Process API Payload and Rebuild Files
        id: processor
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import sys
          from pathlib import Path

          # 讀取 GitHub Dispatch 傳入的事件資料
          event_path = os.environ.get("GITHUB_EVENT_PATH")
          with open(event_path, "r", encoding="utf-8") as file_handle:
              event = json.load(file_handle)

          client_payload = event.get("client_payload", {})
          encoded_msg = client_payload.get("message", "")
          file_data = client_payload.get("file_data", "")
          file_name = client_payload.get("file_name", "attachment.bin")
          title = client_payload.get("title", "Byte Ferryman Mail")

          # 1. 解密文字內文
          if encoded_msg:
              try:
                  decoded_msg = base64.b64decode(encoded_msg).decode("utf-8", errors="replace")
              except Exception as e:
                  decoded_msg = f"[Decode text error] {e}"
          else:
              decoded_msg = "[No text content provided]"

          # 2. 還原實體檔案附件
          download_dir = Path("downloads")
          download_dir.mkdir(exist_ok=True)
          has_attachments = "false"

          if file_data:
              try:
                  file_bytes = base64.b64decode(file_data)
                  # 預防安全問題，清洗檔名
                  safe_file_name = Path(file_name).name
                  dest_path = download_dir / safe_file_name
                  dest_path.write_bytes(file_bytes)
                  has_attachments = "true"
                  print(f"Successfully restored file: {safe_file_name} ({len(file_bytes)} bytes)")
              except Exception as e:
                  print(f"Failed to restore file: {e}")

          # 3. 輸出結果供後續發信步驟使用
          output_path = os.environ.get("GITHUB_OUTPUT")
          if output_path:
              with open(output_path, "a", encoding="utf-8") as output:
                  output.write(f"has_attachments={has_attachments}\n")
                  output.write(f"mail_subject={title}\n")
                  output.write("mail_body<<EOF\n")
                  output.write(decoded_msg)
                  output.write("\nEOF\n")
                  if has_attachments == "true":
                      output.write("attachments=downloads/*\n")
                  else:
                      output.write("attachments=\n")
          PY

      - name: Send mail (with attachments)
        if: steps.processor.outputs.has_attachments == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "【擺渡人API通知】${{ steps.processor.outputs.mail_subject }}"
          to: ${{ secrets.EMAIL_TO || secrets.EMAIL_USERNAME }}
          from: ${{ secrets.EMAIL_USERNAME }}
          body: ${{ steps.processor.outputs.mail_body }}
          attachments: ${{ steps.processor.outputs.attachments }}

      - name: Send mail (no attachments)
        if: steps.processor.outputs.has_attachments != 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "【擺渡人API通知】${{ steps.processor.outputs.mail_subject }}"
          to: ${{ secrets.EMAIL_TO || secrets.EMAIL_USERNAME }}
          from: ${{ secrets.EMAIL_USERNAME }}
          body: ${{ steps.processor.outputs.mail_body }}